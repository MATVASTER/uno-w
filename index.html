</style></head><body>
<div id="toast"></div><div id="shout"></div><div id="tm"></div>
<div id="chat"><button id="cb" onclick="tg()">💬<i id="cbd"></i></button><div id="cp2"><div id="chm"></div><div class="cin"><input id="ci" maxlength="120" placeholder="Escribe un mensaje…" onkeydown="if(event.key=='Enter')sendC()"><button class="bb" onclick="sendC()">➤</button></div></div></div>
<div class="ov" id="warn"><h2 id="wt" style="max-width:420px;padding:0 16px"></h2><div class="row"><button class="bg" id="wy" style="min-width:0">Tirar de todos modos</button><button class="bx" style="min-width:0" onclick="$('warn').style.display='none'">Cancelar</button></div></div>
<div class="s on" id="menu"><div class="fc" style="--c:var(--b);left:6%;top:8%;rotate:-18deg"></div><div class="fc" style="--c:var(--y);left:82%;top:10%;rotate:16deg"></div><div class="fc" style="--c:var(--g);left:10%;top:70%;rotate:14deg"></div><div class="fc" style="--c:var(--r);left:84%;top:68%;rotate:-14deg"></div><div class="fc" style="--c:var(--y);left:44%;top:84%;rotate:-6deg"></div><h1><span>U</span><span>N</span><span>O</span></h1><button class="bg" onclick="go('name')">👥 Multijugador</button>
<button class="bb dis" onclick="soon(this)">🧍 Un jugador (próximamente)</button></div>
<div class="s" id="name"><h2>¿Cómo te llamas?</h2><input id="un" maxlength="14" placeholder="Nombre de usuario">
<button class="bg" onclick="setName()">Continuar</button><button class="bx" onclick="go('menu')">Atrás</button></div>

<div class="s" id="create"><h2>Crear sala</h2><input id="cn" maxlength="16" placeholder="Nombre de la sala"><input id="cp" maxlength="16" placeholder="Contraseña (es el código para unirse)">
<input id="cm" type="number" min="2" max="6" value="4" placeholder="Máx. jugadores (2-6)"><button class="bg" onclick="create()">Crear</button><button class="bx" onclick="go('choose')">Atrás</button></div>

<div class="ov" id="pick"><h2>Elige un color</h2><div class="pk"><button class="br" onclick="pc('r')"></button><button class="by" onclick="pc('y')"></button><button class="bg" onclick="pc('g')"></button><button class="bb" onclick="pc('b')"></button></div></div>
<div class="ov" id="win"><div style="font-size:90px;animation:bn 1s ease-in-out infinite">🏆</div><h2 id="wn"></h2><div id="wb"></div></div>
<script>
const $=i=>document.getElementById(i),SY={S:'⊘',R:'⟲',D:'+2',F:'+4',W:'★',X:'⇄'};
let jf=0,me={id:Math.random().toString(36).slice(2),n:''},R,isHost=false,S=null,G=null,deck=[],disc=[],HPW='',pend=-1,code='';
function go(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==id));$('g').style.display='none';document.body.classList.remove('play')}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2800)}
function soon(b){b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],200)}
function setName(){const v=$('un').value.trim();if(!v)return toast('Escribe un nombre');me.n=v;$('hi').textContent=v;go('choose')}
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const WS_URL='wss://uno-server-i263.onrender.com/';
function wsBase(url){return{join:name=>new Promise(res=>{const ws=new WebSocket(url+'?room='+encodeURIComponent(name)),h={};
ws.onmessage=e=>{const m=JSON.parse(e.data);(h[m.topic]||[]).forEach(f=>f({data:m.data,isMe:false}))};
ws.onopen=()=>res({emit:(t,d)=>{if(ws.readyState==1)ws.send(JSON.stringify({topic:t,data:d}));return Promise.resolve()},on:(t,f)=>{(h[t]=h[t]||[]).push(f)}})})}}
async function conn(c){const base=WS_URL?wsBase(WS_URL):(window.claude?.use?await claude.use('room'):null);if(!base){toast('Multijugador no disponible: abre la página con sesión iniciada');return false}
code=c;R=await base.join('uno-'+c);
R.on('st',m=>{if(isHost||!m.data.players.some(p=>p.id==me.id))return;S=m.data;render()});
R.on('join',m=>isHost&&onJoin(m.data));R.on('act',m=>isHost&&onAct(m.data));
R.on('kick',m=>{if(m.data.to==me.id){toast('Te expulsaron de la sala');setTimeout(()=>location.reload(),1500)}});
R.on('xfer',m=>{if(m.data.to==me.id)becomeHost(m.data.G)});
R.on('chat',m=>{if(!m.isMe)addC(m.data.n,m.data.t)});
R.on('err',m=>{if(m.data.to==me.id){jf=1;toast(m.data.msg);if(!S)go('join')}});return true}
async function create(){const n=$('cn').value.trim()||'Sala',c=slug($('cp').value),mx=Math.max(2,Math.min(6,+$('cm').value||4));
if(!c)return toast('Pon una contraseña (letras o números): será el código');
if(!await conn(c))return;isHost=true;
G={name:n,code:c,max:mx,host:me.id,set:{time:0,nsw:0,r5:0,fc:0,cs:'classic',bg:'green'},h5:null,left:0,players:[{id:me.id,n:me.n}],hands:{},started:0,win:null,top:null,col:'r',turn:0,dir:1,uno:{},msg:''};
S=G;bc();startHost()}
async function joinRoom(){const c=slug($('jn').value);if(!c)return toast('Escribe el código');if(!await conn(c))return;
let t=0;jf=0;S=null;const send=()=>{if(S||jf)return;if(t++>3){toast('No se encontró la sala');return go('join')}
R.emit('join',{id:me.id,n:me.n}).catch(()=>{jf=1;toast('Sin permiso para jugar: el dueño del artifact debe darte acceso de colaborador');go('join')});setTimeout(send,1500)};send()}
let HI,TI,H5T;
function startHost(){stopHost();HI=setInterval(bc,2500);TI=setInterval(()=>{if(!G||!G.started||G.win||!G.set.time)return;if(--G.left<=0){G.msg='⏰ '+G.players[G.turn].n+' se quedó sin tiempo';G.fc=null;G.turn=nx(G.turn);G.left=G.set.time}bc()},1000)}

function h5end(){if(!G||!G.h5)return;clearTimeout(H5T);const sl=G.h5.n,ids=G.players.map(p=>p.id);let lose=[];
if(sl.length)lose=sl.length==ids.length?[sl[sl.length-1]]:ids.filter(i=>!sl.includes(i));
lose.forEach(i=>dr(i,2));G.h5=null;if(lose.length)G.msg='✋ Último en poner la mano: '+lose.map(i=>G.players.find(p=>p.id==i).n).join(', ')+' +2 🍎';bc()}
function bc(){if(!G)return;const o={...G};S=G;render();R.emit('st',o)}
function onJoin(d){if(G.players.some(p=>p.id==d.id))return bc();const e=m=>R.emit('err',{to:d.id,msg:m});
if(G.started)return e('La partida ya empezó');if(G.players.length>=G.max)return e('La sala está llena');

const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(){const d=[];for(const c of 'rgby'){d.push({c,v:'0'},{c,v:'X'});for(const v of '123456789SRD'){d.push({c,v},{c,v})}}for(let i=0;i<4;i++)d.push({c:'k',v:'W'},{c:'k',v:'F'});return shuf(d)}
function start(){deck=mk();G.hands={};G.players.forEach(p=>G.hands[p.id]=deck.splice(0,7));let t;
do{t=deck.shift();if(isNaN(t.v)){deck.push(t);shuf(deck)}}while(isNaN(t.v));
disc=[t];Object.assign(G,{fc:null,h5:null,left:G.set.time,pc:0,last:-1,started:1,win:null,top:t,col:t.c,turn:0,dir:1,uno:{},msg:'¡Empieza la partida!'});bc()}
const ok=(c,s)=>c.c=='k'||c.c==s.col||c.v==s.top.v;
function dr(id,k){const h=G.hands[id];while(k--){if(!deck.length){const t=disc.pop();deck=shuf(disc);disc=[t]}if(!deck.length)return;h.push(deck.shift())}}
const nx=(t,k=1)=>{const n=G.players.length;return((t+G.dir*k)%n+n)%n};
function onAct(d){if(!G.started||G.win)return;if(d.t=='h'){if(G.h5&&!G.h5.n.includes(d.id)){G.h5.n.push(d.id);G.h5.n.length==G.players.length?h5end():bc()}return}const n=G.players.length,t=G.turn,P=G.players[t];
if(d.id!=P.id)return;const h=G.hands[P.id];
if(d.t=='u'){if(h.length==2){G.uno[P.id]=1;G.msg='📢 '+P.n+' dice ¡UNO!';bc()}return}
if(d.t=='f'){if(G.fc&&G.fc.id==P.id){let m=P.n+' terminó su turno';if(h.length==1&&!G.uno[P.id]){dr(P.id,2);m+=' y olvidó decir UNO: +2 🍎'}G.uno[P.id]=0;G.fc=null;G.turn=nx(t);G.left=G.set.time;G.msg=m;bc()}return}
if(d.t=='d'){if(G.fc&&G.fc.id==P.id)return;if(h.some(c=>ok(c,G)))return;dr(P.id,1);G.uno[P.id]=0;G.msg=P.n+' comió una carta';G.turn=nx(t);G.left=G.set.time;return bc()}
const bon=G.fc&&G.fc.id==P.id,c=h[d.i];if(!c||(bon?c.v!=G.fc.v:!ok(c,G)))return;h.splice(d.i,1);disc.push(c);G.top=c;G.pc=(G.pc||0)+1;G.last=t;G.col=c.c=='k'?(d.col||'r'):c.c;let m=P.n+' jugó';
const bonus=G.set.fc&&!isNaN(c.v)&&h.some(x=>x.v==c.v);G.fc=null;
if(!bonus&&h.length==1&&!G.uno[P.id]){dr(P.id,2);m+=' y olvidó decir UNO: +2 🍎'}if(!bonus)G.uno[P.id]=0;
if(!h.length){if(G.set.nsw&&isNaN(c.v)){dr(P.id,1);m+=' (no se gana con especial: +1 🍎)'}else{G.win=P.n;G.msg='';return bc()}}
const nt=nx(t),N=G.players[nt].id;
if(c.v=='S'){G.turn=nx(t,2);m+=' ⊘ bloqueo'}
else if(c.v=='R'){G.dir*=-1;G.turn=n==2?t:nx(t);m+=' ⟲ cambio de sentido'}
else if(c.v=='D'){dr(N,2);G.turn=nx(t,2);m+=' +2'}
else if(c.v=='F'){dr(N,4);G.turn=nx(t,2);m+=' +4'}
else if(c.v=='X'){const r=G.players[(t-1+n)%n].id;[G.hands[P.id],G.hands[r]]=[G.hands[r],G.hands[P.id]];G.turn=nt;m+=' ⇄ ¡intercambió cartas!'}
else if(bonus){G.turn=t;G.fc={id:P.id,v:c.v};m+=' 📄 ¡Fotocopia! puede tirar otro '+c.v}else G.turn=nt;if(G.set.r5&&c.v=='5'){if(G.h5)h5end();G.h5={n:[],k:G.pc};clearTimeout(H5T);H5T=setTimeout(h5end,5000);m+=' ✋ ¡Pongan la mano!'}G.left=G.set.time;G.msg=m;bc()}

function play(i,el){if(busy)return;const h=S.hands[me.id],c=h[i],go=()=>{if(c.c=='k'){pend=i;pendEl=el;$('pick').style.display='flex'}else fly(el,()=>act({t:'p',i}))};
if(S.set.nsw&&h.length==1&&isNaN(c.v))ask('⚠️ No se puede ganar con una carta especial. Si la tiras, el juego te dará una carta y seguirás jugando hasta ganar con una carta normal.',go);else go()}

function tmUp(){const e=$('tm');if(!S||!S.started||S.win||!S.set||!S.set.time){e.style.display='none';return}e.style.display='block';e.textContent='⏱ '+S.left+'s';e.className=S.left<=5?'low':''}

const SH={S:'BLOQUEO',R:'REVERSA',D:'+2',F:'+4',W:'COLOR',X:'¡INTERCAMBIO!'},CL={r:'#ff5252',g:'#69f0ae',b:'#40c4ff',y:'#ffd600'};
function shout(t,c){const e=$('shout');e.textContent=t;e.style.color=c;e.classList.remove('sh');void e.offsetWidth;e.classList.add('sh')}

const a=el.getBoundingClientRect(),b=t.getBoundingClientRect(),c=el.cloneNode(true);
c.style.cssText+=`;position:fixed;left:${a.left}px;top:${a.top}px;margin:0;z-index:7;translate:none;animation:none;pointer-events:none;width:${a.width}px;height:${a.height}px`;

c.animate([{transform:'none'},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) rotate(12deg) scale(${b.width/a.width})`}],{duration:340,easing:'cubic-bezier(.3,.8,.3,1)',fill:'forwards'}).onfinish=()=>{c.remove();busy=0;cb()}}
function eat(){const mi=S.players.findIndex(p=>p.id==me.id),h=S.hands[me.id]||[];if(S.turn!=mi||S.win)return;if(S.fc||h.some(c=>ok(c,S)))return toast('Tienes una carta para jugar: solo puedes comer si no tienes jugada');act({t:'d'})}

document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id=='lobby'));$('lc').textContent=S.name+' ('+S.players.length+'/'+S.max+')';
$('lp').innerHTML=S.players.map(p=>`<div class="pl"><span>${p.id==S.host?'👑 ':'🙂 '}${esc(p.n)}${p.id==me.id?' (tú)':''}</span>${isHost&&p.id!=me.id?`<span><button class="by" title="Hacer líder" onclick="lead('${p.id}')">👑</button> <button class="br" title="Expulsar" onclick="kick('${p.id}')">✖</button></span>`:''}</div>`).join('');$('lo').innerHTML=opts();
$('lb').innerHTML=isHost?(S.players.length>1?'<button class="bg" onclick="start()">▶ Iniciar partida</button>':'<button class="bg dis" onclick="toast(\'Necesitas mínimo 2 jugadores\')">▶ Iniciar partida</button><small>Esperando jugadores… comparte el código</small>'):'<small>Esperando que el anfitrión inicie…</small>';return}
document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));$('g').style.display='grid';document.body.classList.add('play');document.body.dataset.bg=(S.set&&S.set.bg)||'green';document.body.dataset.cs=(S.set&&S.set.cs)||'classic';
const P=S.players.map((p,i)=>({...p,i})),n=P.length,mi=P.findIndex(p=>p.id==me.id);if(mi<0)return;

const h=S.hands[me.id]||[],my=S.turn==mi&&!S.win,fa=my&&S.fc&&S.fc.id==me.id,eo=my&&!fa&&!h.some(c=>ok(c,S)),np=(S.pc||0)>pPc,sw=S.msg!=pMsg&&S.msg.includes('⇄');

const slH=sl.map((id,j)=>{const pi=P.findIndex(p=>p.id==id),[a,b]=org(pi);return `<div class="sh5 ${pSl.includes(id)?'':'slam'}" style="--fx:${a};--fy:${b};left:${OFF[j%6][0]}%;top:${OFF[j%6][1]}%;rotate:${-25+j*14}deg">${hd(pi)}</div>`}).join('');

$('ct').innerHTML=`<div id="pile"><div onclick="eat()" style="cursor:pointer"><div class="cd bk ${eo?'attn':''}"><i></i><b>COMER</b></div></div><div id="ring" class="${pCol&&S.col!=pCol?'rf':''}" style="--c:var(--${S.col})">${cd(S.top,np?(S.last==mi?'pp':'drop'):'','',`--fx:${fx};--fy:${fy};--rot:${((S.pc||0)*47%24)-12}deg`)}<div id="sl">${slH}</div></div><div class="dir" style="animation-delay:-${Date.now()%6000}ms;animation-direction:${S.dir==1?'normal':'reverse'}">↻</div></div><div id="msg">${esc(S.msg)}</div><div id="msg">${my?(fa?'📄 Fotocopia: tira otro '+S.fc.v+' o termina el turno':eo?'🍎 No tienes jugada: ¡come una carta!':'🟢 ¡Es tu turno!'):'Turno de '+P[S.turn].n}</div>`;

{const hn=$('hand'),w=hn.firstChild?hn.firstChild.offsetWidth:62,cw=document.documentElement.clientWidth-(S.h5&&!mine?96:0)-30,k=h.length;let st=k>1?(cw-w)/(k-1):w;st=Math.max(30,Math.min(st,w*.8));hn.style.setProperty('--ov',(st-w)+'px')}
$('win').style.display=S.win?'flex':'none';
